<div class="flex items-center overflow-hidden border border-[#a5f3fc66] bg-[linear-gradient(135deg,#433878,#155e75)] text-[#f5f3ff] shadow-[0_0.75rem_2.25rem_#0004] [&[hidden]]:hidden!"
  [class.rounded-full]="isCompact()" [class.rounded-[1.25rem]]="!isCompact()"
  [hidden]="state.open() && !compact()">
  <button #launcher type="button" class="flex items-center gap-3 text-left"
    [class.size-7]="isCompact()" [class.justify-center]="isCompact()" [class.p-3]="!isCompact()"
    aria-label="Open AI chat" aria-controls="ai-panel" [attr.aria-expanded]="state.open()"
    (click)="openChat(launcher)">
    <fa-icon class="text-[#a5f3fc]" [class.text-sm]="isCompact()" [class.text-[1.5625rem]]="!isCompact()"
      [icon]="faRobot" aria-hidden="true"></fa-icon>
    @if (!isCompact()) {
      <span class="grid gap-0.75"><strong>AI assistant</strong><span class="text-xs text-[#ddd6fe]">Let’s chat</span></span>
    }
  </button>
  @if (!compact() && !state.minimized()) {
    <button type="button" class="mr-2.5 size-9 shrink-0 rounded-[0.625rem] text-2xl hover:bg-white/10"
      aria-label="Minimize AI launcher" (click)="state.minimized.set(true)">
      <fa-icon [icon]="faMinus" aria-hidden="true"></fa-icon>
    </button>
  }
</div>
