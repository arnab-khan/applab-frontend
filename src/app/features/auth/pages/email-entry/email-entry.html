<div class="auth-form">
  <div class="mb-8 text-center">
    <h1 class="text-3xl font-bold text-gray-900">{{ pageContent().title }}</h1>
    <p class="mt-2 text-sm text-gray-600">
      {{ pageContent().description }}
    </p>
  </div>

  <form appScrollToInvalid [formGroup]="emailForm" (ngSubmit)="onSubmit()" class="space-y-5">
    @let emailControl = emailForm.controls.email;
    <app-form-fields [fieldConfig]="{ label: 'New Email' }" [dynamicFormControl]="emailControl"
      [hasClickedSubmit]="hasClickedSubmit()">
      <input type="text" inputmode="email" [formControl]="emailControl"
        class="u-form-field lowercase placeholder:normal-case" name="email" placeholder="Enter new email"
        autocomplete="email" appSanitizeInput [noSpaceAllow]="true" />
    </app-form-fields>

    <app-loading-button [loading]="isSubmitting()" class="mt-10 w-full">
      <button type="submit" class="u-gradient-btn w-full" [disabled]="isSubmitting()">
        Send OTP
      </button>
    </app-loading-button>
  </form>
</div>
