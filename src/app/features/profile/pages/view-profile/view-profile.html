<section class="flex items-center justify-center grow u-responsive-padding-xy">
  <div
    class="overflow-hidden rounded-3xl md:border border-white/50 md:bg-cyan-50 md:shadow-xl md:u-responsive-padding-xy u-container-2">
    <app-user-profile [user]="authState().user" [profileImage]="profileState().profileImage"
      [profileImageLoading]="profileImageLoading()" [showConnectionRequestButton]="false">
      <div profile-actions class="flex flex-wrap gap-3 max-sm:w-full">
        <a routerLink="/profile/edit-profile"
          class="u-btn-primary-cyan px-4 sm:px-9 max-sm:grow w-fit text-center">
          Edit Profile
        </a>
        <button type="button" (click)="onLogout()"
          class="u-btn-danger-rose px-4 sm:px-9 max-sm:grow">
          Logout
        </button>
      </div>
    </app-user-profile>
  </div>
</section>
