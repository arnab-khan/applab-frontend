<div class="sticky z-10" [style.top.px]="headerHeight()">
  <header class="u-container-2-5 mx-auto rounded-b-md py-1 backdrop-blur-3xl">
    <div class="rounded-md border border-white/20 bg-white/20 px-3 py-1 shadow-lg">
      <a [routerLink]="recipientUsername() ? ['/user', recipientUsername()] : null"
        class="flex items-center justify-center gap-2 no-underline" target="_blank" rel="noopener noreferrer">
        <app-thumbnail [imageUrl]="recipientProfileImageUrl()"
          [name]="recipientName() || recipientUsername()" [showBorder]="false"
          [alt]="(recipientName() || recipientUsername() || 'User') + ' profile image'"
          size="1.5rem" radius="50%" class="shrink-0">
        </app-thumbnail>
        <p class="min-w-0 truncate text-sm text-white/75">
          Chat with
          <span class="font-semibold text-white">{{ recipientName() || recipientUsername() || 'User' }}</span>
        </p>
      </a>
    </div>
  </header>
</div>

<main class="u-container-2-5 u-responsive-padding-x mx-auto flex grow flex-col">
  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  } @else {
    <app-chat-room [chatRoomId]="chatRoomId()"></app-chat-room>
  }
</main>
